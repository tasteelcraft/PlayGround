<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AFTERLIGHT — Dynamic Genesis</title>
    <style>
      :root {
        --bg: #0d1210;
        --bg2: #121b17;
        --panel: rgba(15, 23, 19, 0.9);
        --panel2: rgba(21, 31, 26, 0.9);
        --line: rgba(160, 185, 164, 0.18);
        --text: #edf2ea;
        --muted: #a3b5a5;
        --lime: #c8f06d;
        --lime2: #6acb7f;
        --orange: #ffb179;
        --red: #ff7869;
        --cyan: #8ad0da;
        --shadow: rgba(0, 0, 0, 0.34);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, "Segoe UI", sans-serif; }
      body { overflow: hidden; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: radial-gradient(circle at top, #1f2f25 0%, #0e1813 34%, #090d0b 100%); }

      #hud {
        position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; padding: 18px 18px 14px;
      }

      .topbar {
        display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
      }

      .brand {
        display: flex; align-items: center; gap: 12px; background: rgba(12,17,15,0.52); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; backdrop-filter: blur(10px);
      }

      .brandmark {
        width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: linear-gradient(135deg, var(--lime), #d8ff95); color: #10210f; font-weight: 900; box-shadow: 0 0 25px rgba(200, 240, 109, 0.3);
      }

      .brand-text { line-height: 1.1; }
      .brand-text strong { display: block; font-size: 12px; letter-spacing: 0.24em; }
      .brand-text span { display: block; margin-top: 3px; font-size: 9px; letter-spacing: 0.2em; color: var(--muted); }

      .top-actions {
        display: flex; align-items: center; gap: 10px;
      }

      .pill, .panel, .mini-btn, .action-btn {
        pointer-events: auto;
        border: 1px solid var(--line);
        background: rgba(11, 18, 15, 0.7);
        border-radius: 10px;
        color: var(--text);
        box-shadow: 0 10px 30px rgba(0,0,0,.15);
        backdrop-filter: blur(8px);
      }

      .pill {
        padding: 9px 12px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
      }
      .pill b { color: var(--lime); }
      .mini-btn {
        width: 36px; height: 36px; display: grid; place-items: center; font-size: 18px; cursor: pointer; transition: transform .12s ease, border-color .12s ease;
      }
      .mini-btn:hover, .action-btn:hover { transform: translateY(-1px); border-color: rgba(200, 240, 109, 0.6); }

      .resource-bar {
        display: grid; grid-template-columns: repeat(5, minmax(100px, 1fr)); gap: 10px; margin-top: 16px;
      }

      .resource {
        background: rgba(17, 24, 20, 0.7); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; align-items: flex-end; justify-content: space-between; min-height: 68px;
      }
      .res-meta { display: flex; flex-direction: column; }
      .res-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
      .res-value { font-size: 25px; font-weight: 700; margin-top: 7px; line-height: 1; }
      .res-icon { font-size: 20px; opacity: 0.8; }

      .content {
        display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; margin-top: 18px; flex: 1; min-height: 0;
      }

      .playfield { position: relative; min-height: 0; }

      .panel {
        background: rgba(13, 20, 17, 0.78); border: 1px solid var(--line); border-radius: 15px; overflow: hidden;
      }

      .viewport {
        position: relative; height: 100%; min-height: 445px; border-radius: 15px; overflow: hidden; border: 1px solid var(--line); pointer-events: none;
        background: rgba(13, 20, 17, 0.06); backdrop-filter: none; -webkit-backdrop-filter: none;
      }

      .overlay-bar {
        position: absolute; left: 18px; right: 18px; bottom: 18px; display: flex; justify-content: space-between; align-items: center; gap: 14px; pointer-events: none;
      }

      .toolbar {
        display: flex; flex-wrap: wrap; gap: 8px; pointer-events: auto; max-width: 72%;
      }
      .action-btn {
        cursor: pointer; background: rgba(17, 25, 20, 0.82); color: var(--text); padding: 9px 12px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; border-radius: 9px; transition: transform .12s ease, border-color .12s ease, background .12s ease;
      }
      .action-btn.primary { background: linear-gradient(135deg, rgba(200,240,109,.2), rgba(200,240,109,.08)); color: #eef8d8; border-color: rgba(200,240,109,.4); }
      .action-btn.warning { border-color: rgba(255,177,121,.4); }
      .action-btn.full { width: 100%; }

      .status-box {
        pointer-events: auto; background: rgba(18, 26, 22, 0.8); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 180px;
      }
      .status-box strong { display: block; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
      .status-box span { display: block; margin-top: 4px; color: var(--text); font-size: 13px; }

      .side {
        display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow-y: auto; scrollbar-width: thin;
      }
      .side > .panel { flex: 0 0 auto; }

      .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
      .panel-header h3 { margin: 0; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
      .tag {
        display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; border: 1px solid rgba(200,240,109,.35); background: rgba(200,240,109,.08); color: var(--lime); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; padding: 7px 9px;
      }
      .tag::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 10px rgba(200,240,109,.9); }

      .panel-body { padding: 14px 16px 16px; }

      .objective {
        border: 1px solid rgba(200,240,109,.25); background: linear-gradient(135deg, rgba(200,240,109,.08), rgba(138,208,218,.04)); border-radius: 12px; padding: 14px; margin-top: 12px;
      }
      .objective small { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--lime); }
      .objective h4 { margin: 8px 0 8px; font-size: 18px; }
      .objective p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .objective .bar { height: 5px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 12px; }
      .objective .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--lime), #a3d15b); border-radius: inherit; }

      .profile-wrap { display: flex; align-items: center; gap: 12px; margin-top: 12px; }
      .profile-avatar { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, rgba(200,240,109,.25), rgba(138,208,218,.15)); border: 1px solid var(--line); display: grid; place-items: center; font-size: 18px; }
      .profile-meta strong { display: block; font-size: 14px; }
      .profile-meta span { display: block; margin-top: 5px; color: var(--muted); font-size: 11px; }

      .traits { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
      .trait { background: rgba(255,255,255,0.02); border: 1px solid var(--line); padding: 6px 8px; border-radius: 7px; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

      .log-list { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
      .log-item { display: flex; gap: 10px; color: var(--muted); font-size: 12px; line-height: 1.5; }
      .log-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); margin-top: 5px; box-shadow: 0 0 10px rgba(200,240,109,.5); }
      .log-item strong { color: var(--text); display: block; margin-bottom: 3px; }

      #actionPanel { display: flex; flex-direction: row; gap: 10px; }
      .stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin-top: 12px; }
      .stat-card { border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.02); padding: 10px 12px; }
      .stat-card span { display: block; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      .stat-card b { display: block; margin-top: 6px; font-size: 18px; }

      .touch-controls { display: none; position: absolute; left: 18px; bottom: 18px; z-index: 3; }
      .joystick {
        width: 88px; height: 88px; border: 1px solid rgba(220,240,220,.3); border-radius: 50%;
        background: rgba(15,23,19,.62); display: grid; place-items: center; touch-action: none; user-select: none;
        box-shadow: inset 0 0 22px rgba(0,0,0,.24); pointer-events: auto;
      }
      .joystick-knob { width: 36px; height: 36px; border: 1px solid rgba(200,240,109,.72); border-radius: 50%; background: rgba(200,240,109,.24); box-shadow: 0 0 18px rgba(200,240,109,.18); }

      @media (max-width: 960px) {
        #hud { padding: 10px; }
        .resource-bar { grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; }
        .resource { padding: 8px; min-height: 54px; }
        .res-value { font-size: 19px; }
        .content { grid-template-columns: 1fr; }
        .side { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); grid-auto-rows: max-content; align-content: start; overflow: auto; }
        .side > .panel { min-height: 0; }
        .touch-controls { display: flex; pointer-events: none; }
        .overlay-bar { left: 120px; }
        #actionPanel { flex-direction: row; flex-wrap: wrap; gap: 8px; }
        .toolbar { max-width: 100%; }
      }

      @media (max-width: 640px) {
        #hud { padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); overflow-y: auto; }
        .content { height: min(72dvh, 620px); min-height: 300px; }
        .viewport { height: 100%; min-height: 0; }
        .brand { padding: 7px 9px; gap: 8px; }
        .brandmark { width: 26px; height: 26px; }
        .brand-text strong { letter-spacing: 0.12em; font-size: 10px; }
        .brand-text span { font-size: 7px; }
        .top-actions { gap: 5px; }
        .pill { padding: 8px; font-size: 9px; letter-spacing: .08em; }
        .mini-btn { width: 34px; height: 34px; }
        .resource-bar { margin-top: 8px; }
        .resource { min-height: 48px; padding: 6px; border-radius: 8px; }
        .res-label { font-size: 7px; letter-spacing: .1em; }
        .res-value { font-size: 17px; margin-top: 5px; }
        .res-icon { display: none; }
        .content { display: block; flex: none; margin-top: 8px; }
        .side { display: none; }
        .overlay-bar { left: 10px; right: 10px; bottom: 10px; align-items: flex-end; gap: 8px; }
        .toolbar { flex: 1 1 auto; min-width: 0; margin-left: 84px; flex-wrap: nowrap; overflow-x: auto; max-width: calc(100% - 84px); padding: 3px 2px 6px; scrollbar-width: none; }
        #actionPanel { flex-direction: row; flex-wrap: nowrap; gap: 8px; }
        .toolbar::-webkit-scrollbar { display: none; }
        .action-btn { white-space: nowrap; padding: 9px 10px; font-size: 9px; }
        .status-box { display: none; }
        .touch-controls { position: absolute; left: 12px; bottom: 12px; z-index: 3; }
        .joystick { width: 78px; height: 78px; }
        .joystick-knob { width: 32px; height: 32px; }
      }

      @media (orientation: landscape) and (max-height: 520px) {
        #hud { padding: 6px; }
        .resource-bar { margin-top: 5px; }
        .resource { min-height: 40px; padding: 4px 7px; }
        .res-value { font-size: 15px; margin-top: 3px; }
        .content { margin-top: 5px; }
        .viewport { min-height: 230px; }
        .side { display: none; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="topbar">
        <div class="brand">
          <div class="brandmark">✦</div>
          <div class="brand-text">
            <strong>AFTERLIGHT</strong>
            <span>PROJECT DYNAMIC GENESIS</span>
          </div>
        </div>

        <div class="top-actions">
          <div class="pill">Day <b id="dayValue">01</b> · <span id="weatherValue">Clear</span></div>
          <button class="mini-btn" id="resetBtn" title="New campaign">↺</button>
        </div>
      </div>

      <div class="resource-bar" id="resourceBar"></div>

      <div class="content">
        <div class="playfield panel viewport">
          <div class="overlay-bar">
            <div class="toolbar" id="actionPanel"></div>
            <div class="status-box">
              <strong>Current Phase</strong>
              <span id="phaseText">SURVIVAL</span>
            </div>
          </div>
          <div class="touch-controls" aria-label="Movement controls">
            <div class="joystick" id="joystick" role="application" aria-label="Move character">
              <div class="joystick-knob" id="joystickKnob"></div>
            </div>
          </div>
        </div>

        <aside class="side">
          <section class="panel">
            <div class="panel-header">
              <h3>Campaign</h3>
              <div class="tag" id="phaseTag">CHAPTER 01</div>
            </div>
            <div class="panel-body">
              <div class="objective" id="objectivePanel"></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3>Playstyle</h3>
            </div>
            <div class="panel-body">
              <div class="profile-wrap" id="profilePanel"></div>
              <div class="traits" id="traitList"></div>
              <div class="stat-grid" id="statGrid"></div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <h3>World Signals</h3>
            </div>
            <div class="panel-body">
              <div class="log-list" id="logList"></div>
            </div>
          </section>
        </aside>
      </div>
    </div>

    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

      const canvas = document.getElementById('game');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b120f);
      scene.fog = new THREE.Fog(0x0b120f, 18, 70);

      const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 12, 16);

      const clock = new THREE.Clock();
      const keys = {};
      const worldSize = 40;
      const halfSize = worldSize / 2;

      const state = {
        day: 1,
        weather: 'Clear',
        resources: { food: 40, power: 36, scrap: 28, credits: 18, intel: 5 },
        style: { architect: 1, tycoon: 0, renegade: 0, operator: 0 },
        heat: 1,
        city: 0,
        orbit: 0,
        habitat: 0,
        logs: [
          { title: 'A quiet sunrise', text: 'The shelter hums and holds.' },
          { title: 'Signal drift', text: 'A distant relay flickers at the edge of the valley.' },
          { title: 'Outside', text: 'Unclaimed ground waits in all directions.' }
        ],
        people: [
          { name: 'Mara', role: 'Caretaker', color: '#d7f092', x: -1.5, z: 0.5, needs: { hunger: 72, energy: 70, morale: 68 } },
          { name: 'Ivo', role: 'Scavenger', color: '#8ad0da', x: 1.5, z: -1.5, needs: { hunger: 68, energy: 60, morale: 72 } },
          { name: 'Sera', role: 'Tinkerer', color: '#ffb179', x: 0.5, z: 1.8, needs: { hunger: 80, energy: 74, morale: 76 } }
        ],
        structures: [],
        resourceNodes: [],
        enemies: [],
        mode: 'survival',
        buildingIdx: 0,
        selectedAction: null,
        totalGathered: 0,
        openMarket: false,
        unlockedSatellite: false,
      };

      const resourceDefs = {
        food: { icon: '◌', label: 'Rations' },
        power: { icon: 'ϟ', label: 'Power' },
        scrap: { icon: '⬡', label: 'Scrap' },
        credits: { icon: '¤', label: 'Credits' },
        intel: { icon: '⌁', label: 'Intel' }
      };

      const buildingDefs = {
        habitat: { color: 0x7aa36d, size: [3.4, 2.2, 3.2], cost: { scrap: 10, power: 4 }, label: 'Habitat' },
        garden: { color: 0x9ad16d, size: [3, 1.8, 3], cost: { scrap: 15, power: 6, food: 3 }, label: 'Garden' },
        workshop: { color: 0xe7a860, size: [3.8, 2.8, 3.4], cost: { scrap: 18, power: 8 }, label: 'Workshop' },
        relay: { color: 0x8ad0da, size: [3.4, 2.6, 3.4], cost: { scrap: 20, power: 10, intel: 4 }, label: 'Relay' },
        market: { color: 0xc7b0ff, size: [4, 3, 4], cost: { credits: 14, scrap: 12 }, label: 'Market' }
      };

      let player = {
        group: new THREE.Group(),
        velocity: new THREE.Vector3(),
        speed: 6.5,
        radius: 0.8,
        position: new THREE.Vector3(0, 0.75, 0),
        yaw: 0,
      };

      let cameraTarget = new THREE.Vector3();
      let cameraOrbit = { yaw: 0.8, pitch: 0.9, distance: 12.5 };
      let pointerDown = false;
      let lastMouse = { x: 0, y: 0 };
      const touchMove = { x: 0, y: 0 };
      let joystickPointer = null;

      const resourceTypeOrder = ['food', 'scrap', 'power', 'intel', 'credits'];

      function initScene() {
        const hemi = new THREE.HemisphereLight(0xa8d8af, 0x101512, 1.8);
        scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xf8f2d9, 1.6);
        sun.position.set(12, 18, 8);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.left = -28;
        sun.shadow.camera.right = 28;
        sun.shadow.camera.top = 28;
        sun.shadow.camera.bottom = -28;
        scene.add(sun);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(worldSize, worldSize),
          new THREE.MeshStandardMaterial({ color: 0x1e3328, roughness: 0.96, metalness: 0.04 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const road = new THREE.Mesh(
          new THREE.BoxGeometry(38, 0.08, 3.4),
          new THREE.MeshStandardMaterial({ color: 0x252f2b, roughness: 0.9 })
        );
        road.position.set(0, 0.04, 0);
        road.receiveShadow = true;
        scene.add(road);

        const grid = new THREE.GridHelper(worldSize, 20, 0x4a6552, 0x24382c);
        grid.position.y = 0.05;
        scene.add(grid);

        const basePad = new THREE.Mesh(
          new THREE.CylinderGeometry(4.8, 5.2, 0.8, 20),
          new THREE.MeshStandardMaterial({ color: 0x3b4d42, metalness: 0.2, roughness: 0.8 })
        );
        basePad.position.y = 0.4;
        basePad.receiveShadow = true;
        scene.add(basePad);

        player.group.position.set(0, 0.75, 0);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdfe8dd, roughness: 0.7 });
        const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.52, 1.2, 4, 8), bodyMat);
        body.castShadow = true;
        body.position.y = 0.7;
        player.group.add(body);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 18, 18), new THREE.MeshStandardMaterial({ color: 0xe5cda8, roughness: 0.8 }));
        head.position.y = 1.72;
        head.castShadow = true;
        player.group.add(head);

        const visor = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.18, 0.18), new THREE.MeshStandardMaterial({ color: 0x1a221d, emissive: 0x1d2d27, emissiveIntensity: 0.4 }));
        visor.position.set(0, 1.72, 0.3);
        player.group.add(visor);

        scene.add(player.group);

        createResourceNodes();
        createEnemies();
        buildStructure('habitat', -4, 0, true);
        buildStructure('garden', 2.5, -2.5, true);
      }

      function createResourceNodes() {
        const terrains = [
          { type: 'scrap', x: -16, z: 13 },
          { type: 'food', x: 18, z: -14 },
          { type: 'power', x: 15, z: 11 },
          { type: 'intel', x: -13, z: -17 },
          { type: 'credits', x: 22, z: 3 },
          { type: 'scrap', x: -8, z: 20 },
          { type: 'food', x: 9, z: -20 }
        ];

        terrains.forEach((item, idx) => {
          const geometry = item.type === 'power' ? new THREE.OctahedronGeometry(0.7, 0) : new THREE.CylinderGeometry(0.7, 0.9, 1.5, 8);
          const colorMap = { scrap: 0xb9c9d6, food: 0x9bd666, power: 0x8ad0da, intel: 0xc5b2ff, credits: 0xf0c96d };
          const material = new THREE.MeshStandardMaterial({ color: colorMap[item.type], emissive: colorMap[item.type], emissiveIntensity: 0.2, roughness: 0.7, metalness: 0.2 });
          const mesh = new THREE.Mesh(geometry, material);
          mesh.position.set(item.x, 0.9, item.z);
          mesh.castShadow = true;
          mesh.userData = { type: item.type, id: `node-${idx}`, active: true };
          scene.add(mesh);
          state.resourceNodes.push(mesh);
        });
      }

      function createEnemies() {
        const enemyTypes = [0x7a5a53, 0x8f1e25, 0x4c6b68];
        for (let i = 0; i < 4; i++) {
          const g = new THREE.Group();
          const body = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.75, 1.4), new THREE.MeshStandardMaterial({ color: enemyTypes[i % enemyTypes.length], metalness: 0.6, roughness: 0.3 }));
          body.castShadow = true;
          body.position.y = 0.8;
          g.add(body);
          const wire = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.8), new THREE.MeshStandardMaterial({ color: 0xdfe3df, emissive: 0x6a1918, emissiveIntensity: 0.8 }));
          wire.position.set(0, 0.95, 0.6);
          g.add(wire);
          const x = -10 + Math.random() * 20;
          const z = -10 + Math.random() * 20;
          g.position.set(x, 0, z);
          g.userData = { speed: 1.8 + Math.random() * 1.4, drift: i };
          scene.add(g);
          state.enemies.push(g);
        }
      }

      function buildStructure(type, x = 0, z = 0, silent = false) {
        const def = buildingDefs[type];
        if (!def) return;

        const placement = { x: clampNumber(x, -18, 18), z: clampNumber(z, -18, 18) };
        const canAfford = Object.entries(def.cost).every(([key, value]) => state.resources[key] >= value);
        if (!silent && !canAfford) {
          notify('Not enough resources for that build.');
          return;
        }

        if (!silent) {
          for (const [key, value] of Object.entries(def.cost)) {
            state.resources[key] -= value;
          }
        }

        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.8, metalness: 0.1, emissive: def.color, emissiveIntensity: 0.08 });
        const building = new THREE.Mesh(new THREE.BoxGeometry(...def.size), mat);
        building.castShadow = true;
        building.receiveShadow = true;
        building.position.y = def.size[1] / 2;
        group.add(building);

        group.position.set(placement.x, 0, placement.z);
        scene.add(group);

        state.structures.push({ type, x: placement.x, z: placement.z, mesh: group });

        if (type === 'habitat') state.habitat++;
        if (type === 'garden') state.style.architect += 2;
        if (type === 'workshop') state.style.tycoon += 1;
        if (type === 'relay') state.style.operator += 2;
        if (type === 'market') {
          state.city += 1;
          state.style.tycoon += 2;
          state.style.renegade += 1;
        }

        if (!silent) {
          addLog(def.label + ' constructed', 'Your settlement is becoming more stable.');
          notify(`${def.label} is up and running.`);
          renderUI();
        }
      }

      function gatherNearestNode() {
        let nearest = null;
        for (const node of state.resourceNodes) {
          if (!node.userData.active) continue;
          const dist = player.group.position.distanceTo(node.position);
          if (dist < 3.2 && (!nearest || dist < nearest.dist)) {
            nearest = { node, dist };
          }
        }

        if (!nearest) {
          notify('No resource node close enough.');
          return;
        }

        const type = nearest.node.userData.type;
        const gains = { scrap: 7, food: 8, power: 7, intel: 4, credits: 5 };
        state.resources[type] = (state.resources[type] || 0) + gains[type];
        state.totalGathered += gains[type];
        state.style.tycoon += 1;
        if (type === 'intel') state.style.operator += 1;
        nearest.node.userData.active = false;
        nearest.node.visible = false;
        setTimeout(() => {
          nearest.node.visible = true;
          nearest.node.userData.active = true;
        }, 6000);
        addLog('Resource secured', `${type.toUpperCase()} recovered from the field.`);
        notify(`Recovered ${gains[type]} ${type}.`);
        renderUI();
      }

      function advanceDay() {
        state.day += 1;
        state.weather = ['Clear', 'Dust', 'Storm', 'Warm'][state.day % 4];
        state.resources.food = Math.max(0, state.resources.food - 4 + (countStructures('garden') * 3));
        state.resources.power = Math.max(0, state.resources.power - 3 + (countStructures('relay') * 2));
        state.resources.scrap = Math.max(0, state.resources.scrap + 4 + Math.min(12, countStructures('workshop') * 3));
        state.resources.credits = Math.max(0, state.resources.credits + state.city * 3);
        state.resources.intel = Math.max(0, state.resources.intel + countStructures('relay') * 2);

        if (state.resources.food <= 8) {
          state.heat = Math.min(10, state.heat + 1);
          addLog('Supply pressure', 'Your settlement is running thin on food.');
        }

        if (state.city >= 1) {
          state.style.tycoon += 2;
          addLog('The city opens', 'Trade routes appear beyond the distant lights.');
        }

        if (state.day >= 4 && !state.openMarket) {
          state.openMarket = true;
          addLog('Market route', 'A stable caravan route is now available.');
          buildStructure('market', 9, -6, true);
        }

        if (state.day >= 7 && !state.unlockedSatellite) {
          state.unlockedSatellite = true;
          addLog('Orbital window', 'The sky is finally clear enough for a launch attempt.');
        }

        if (state.day >= 4 && state.city >= 1) state.mode = 'enterprise';
        if (state.day >= 7) state.mode = 'orbital';
        renderUI();
      }

      function countStructures(type) {
        return state.structures.filter(item => item.type === type).length;
      }

      function buildPlayerActionBar() {
        const btns = [
          { label: 'Gather', action: 'gather' },
          { label: 'End Day', action: 'nextday', primary: true },
          { label: 'Build Habitat', action: 'build:habitat' },
          { label: 'Build Garden', action: 'build:garden' },
          { label: 'Build Workshop', action: 'build:workshop' },
          { label: 'Build Relay', action: 'build:relay' },
          { label: 'Launch Orbital', action: 'launch' },
          { label: 'Raid Convoy', action: 'raid' }
        ];

        const panel = document.getElementById('actionPanel');
        panel.innerHTML = '';

        btns.forEach((btn) => {
          const el = document.createElement('button');
          el.className = `action-btn${btn.primary ? ' primary' : ''} ${btn.action === 'raid' ? 'warning' : ''}`;
          el.textContent = btn.label;
          el.addEventListener('click', () => handleAction(btn.action));
          panel.appendChild(el);
        });
      }

      function renderUI() {
        const resourceBar = document.getElementById('resourceBar');
        resourceBar.innerHTML = '';
        for (const key of resourceTypeOrder) {
          const item = document.createElement('div');
          item.className = 'resource';
          item.innerHTML = `
            <div class="res-meta">
              <span class="res-label">${resourceDefs[key].label}</span>
              <span class="res-value">${Math.floor(state.resources[key] || 0)}</span>
            </div>
            <span class="res-icon">${resourceDefs[key].icon}</span>
          `;
          resourceBar.appendChild(item);
        }

        document.getElementById('dayValue').textContent = String(state.day).padStart(2, '0');
        document.getElementById('weatherValue').textContent = state.weather;
        document.getElementById('phaseText').textContent = state.mode.toUpperCase();
        document.getElementById('phaseTag').textContent = state.day >= 7 ? 'CHAPTER 03' : state.city >= 1 ? 'CHAPTER 02' : 'CHAPTER 01';

        const objective = document.getElementById('objectivePanel');
        const progress = Math.min(100, Math.round((state.day / 9) * 100));
        const objectiveText = state.day < 4 ? 'Keep the shelter alive and secure the valley.' : state.city < 2 ? 'Expand into the city and secure trade routes.' : 'Launch beyond the atmosphere and claim a new horizon.';
        objective.innerHTML = `
          <small>Primary Directive</small>
          <h4>${state.day < 4 ? 'Survival' : state.city < 2 ? 'Expansion' : 'Orbital Reach'}</h4>
          <p>${objectiveText}</p>
          <div class="bar"><i style="width:${progress}%"></i></div>
        `;

        const profile = getProfile();
        document.getElementById('profilePanel').innerHTML = `
          <div class="profile-avatar">${profile.icon}</div>
          <div class="profile-meta">
            <strong>${profile.name}</strong>
            <span>${profile.summary}</span>
          </div>
        `;

        const traitList = document.getElementById('traitList');
        traitList.innerHTML = Object.entries(state.style)
          .sort((a, b) => b[1] - a[1])
          .map(([key, value]) => `<span class="trait">${labelForStyle(key)} ${value}</span>`)
          .join('');

        const statGrid = document.getElementById('statGrid');
        statGrid.innerHTML = `
          <div class="stat-card"><span>Heat</span><b>${state.heat}/10</b></div>
          <div class="stat-card"><span>City</span><b>${state.city}</b></div>
          <div class="stat-card"><span>Habitats</span><b>${countStructures('habitat')}</b></div>
          <div class="stat-card"><span>People</span><b>${state.people.length}</b></div>
        `;

        const logs = document.getElementById('logList');
        logs.innerHTML = state.logs.map((entry) => `
          <div class="log-item">
            <div class="log-dot"></div>
            <div>
              <strong>${entry.title}</strong>
              <div>${entry.text}</div>
            </div>
          </div>
        `).join('');
      }

      function labelForStyle(key) {
        return { architect: 'Build', tycoon: 'Trade', renegade: 'Heat', operator: 'Ops' }[key] || key;
      }

      function getProfile() {
        const entries = Object.entries(state.style);
        const winner = entries.reduce((best, item) => item[1] > best[1] ? item : best, ['architect', 0]);
        if (winner[1] <= 0) return { name: 'The Pioneer', icon: '✦', summary: 'A fragile beginning.' };

        const map = {
          architect: { name: 'The Architect', icon: '⌂', summary: 'Shelter growth and social stability.' },
          tycoon: { name: 'The Governor', icon: '◈', summary: 'Industry, logistics, and expansion.' },
          renegade: { name: 'The Renegade', icon: '⚑', summary: 'Risk, heat, and black-market routes.' },
          operator: { name: 'The Operator', icon: '⌖', summary: 'Fieldcraft, combat, and security.' },
        };
        return map[winner[0]];
      }

      function addLog(title, text) {
        state.logs.unshift({ title, text });
        state.logs = state.logs.slice(0, 5);
      }

      function notify(message) {
        const old = document.getElementById('toast');
        if (old) old.remove();
        const toast = document.createElement('div');
        toast.id = 'toast';
        toast.textContent = message;
        toast.style.position = 'fixed';
        toast.style.bottom = '20px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.background = 'rgba(17, 23, 18, 0.94)';
        toast.style.border = '1px solid rgba(200,240,109,.35)';
        toast.style.padding = '10px 14px';
        toast.style.borderRadius = '10px';
        toast.style.fontSize = '11px';
        toast.style.letterSpacing = '0.12em';
        toast.style.textTransform = 'uppercase';
        toast.style.zIndex = '1000';
        document.body.appendChild(toast);
        clearTimeout(notify.timeout);
        notify.timeout = setTimeout(() => toast.remove(), 1800);
      }

      function handleAction(action) {
        if (action === 'gather') {
          gatherNearestNode();
        } else if (action === 'nextday') {
          advanceDay();
        } else if (action === 'launch') {
          if (!state.unlockedSatellite) { notify('Orbital window not yet available.'); return; }
          if (state.resources.scrap < 28 || state.resources.power < 18 || state.resources.intel < 10) { notify('Need more scrap, power and intel.'); return; }
          state.resources.scrap -= 28;
          state.resources.power -= 18;
          state.resources.intel -= 10;
          state.orbit = 1;
          state.style.tycoon += 4;
          addLog('Orbital launch', 'The first true launch leaves the atmosphere and changes everything.');
          notify('Launch successful.');
          renderUI();
        } else if (action === 'raid') {
          if (state.resources.food < 8) { notify('You need food for the team.'); return; }
          state.resources.food -= 8;
          state.resources.scrap += 12;
          state.resources.credits += 9;
          state.heat = Math.min(10, state.heat + 2);
          state.style.renegade += 2;
          state.style.operator += 1;
          addLog('Convoy hit', 'The route pays off, but the world notices.');
          notify('Raid complete.');
          renderUI();
        } else if (action.startsWith('build:')) {
          const type = action.split(':')[1];
          const def = buildingDefs[type];
          if (!def) return;
          if (!canAfford(def.cost)) { notify('You cannot afford this structure.'); return; }
          const targetX = Math.round(player.group.position.x / 2.5) * 2.5;
          const targetZ = Math.round(player.group.position.z / 2.5) * 2.5;
          buildStructure(type, targetX, targetZ, false);
        }
      }

      function canAfford(cost) {
        return Object.entries(cost).every(([key, value]) => (state.resources[key] || 0) >= value);
      }

      function animate() {
        const dt = clock.getDelta();
        const moveX = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0) + touchMove.x;
        const moveZ = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0) - touchMove.y;

        if (moveX || moveZ) {
          const inputMagnitude = Math.min(1, Math.hypot(moveX, moveZ));
          const dir = new THREE.Vector3(moveX, 0, moveZ).normalize();
          const speed = (keys['shift'] ? 1.5 : 1) * player.speed * inputMagnitude;
          player.group.position.x += dir.x * speed * dt;
          player.group.position.z += dir.z * speed * dt;
          player.group.position.x = clampNumber(player.group.position.x, -18, 18);
          player.group.position.z = clampNumber(player.group.position.z, -18, 18);
        }

        player.group.rotation.y = Math.atan2(cameraOrbit.yaw, 1) + Math.PI * 0.15;

        state.enemies.forEach((enemy, idx) => {
          enemy.position.x += Math.sin(clock.elapsedTime * (0.8 + idx * 0.15) + enemy.userData.drift) * 0.02;
          enemy.position.z += Math.cos(clock.elapsedTime * (0.7 + idx * 0.18) + enemy.userData.drift) * 0.02;
          enemy.position.x = clampNumber(enemy.position.x, -18, 18);
          enemy.position.z = clampNumber(enemy.position.z, -18, 18);
        });

        cameraTarget.copy(player.group.position).add(new THREE.Vector3(0, 1.8, 0));
        const cosYaw = Math.cos(cameraOrbit.yaw);
        const sinYaw = Math.sin(cameraOrbit.yaw);
        const cameraOffset = new THREE.Vector3(cosYaw * cameraOrbit.distance, 7.5 + Math.sin(cameraOrbit.pitch) * 2.8, sinYaw * cameraOrbit.distance);
        const desired = cameraTarget.clone().add(cameraOffset);
        camera.position.lerp(desired, 0.08);
        camera.lookAt(cameraTarget);

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }

      function clampNumber(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function onKeyDown(event) {
        const key = event.key.toLowerCase();
        if (key === 'e') gatherNearestNode();
        if (key === ' ') {
          event.preventDefault();
          handleAction('nextday');
        }
        keys[key] = true;
      }

      function onKeyUp(event) {
        const key = event.key.toLowerCase();
        keys[key] = false;
      }

      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);

      const joystick = document.getElementById('joystick');
      const joystickKnob = document.getElementById('joystickKnob');
      function updateJoystick(event) {
        const rect = joystick.getBoundingClientRect();
        const maxRadius = rect.width * 0.32;
        const dx = event.clientX - (rect.left + rect.width / 2);
        const dy = event.clientY - (rect.top + rect.height / 2);
        const length = Math.hypot(dx, dy);
        const scale = length > maxRadius ? maxRadius / length : 1;
        const x = dx * scale;
        const y = dy * scale;
        touchMove.x = x / maxRadius;
        touchMove.y = y / maxRadius;
        joystickKnob.style.transform = `translate(${x}px, ${y}px)`;
      }
      joystick.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        joystickPointer = event.pointerId;
        joystick.setPointerCapture(event.pointerId);
        updateJoystick(event);
      });
      joystick.addEventListener('pointermove', (event) => {
        if (event.pointerId === joystickPointer) updateJoystick(event);
      });
      const releaseJoystick = (event) => {
        if (event.pointerId !== joystickPointer) return;
        joystickPointer = null;
        touchMove.x = 0;
        touchMove.y = 0;
        joystickKnob.style.transform = '';
      };
      joystick.addEventListener('pointerup', releaseJoystick);
      joystick.addEventListener('pointercancel', releaseJoystick);

      canvas.style.touchAction = 'none';
      canvas.addEventListener('pointerdown', (event) => {
        pointerDown = true;
        lastMouse.x = event.clientX;
        lastMouse.y = event.clientY;
        canvas.setPointerCapture?.(event.pointerId);
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!pointerDown) return;
        const dx = event.clientX - lastMouse.x;
        const dy = event.clientY - lastMouse.y;
        lastMouse.x = event.clientX;
        lastMouse.y = event.clientY;
        cameraOrbit.yaw += dx * 0.005;
        cameraOrbit.pitch = clampNumber(cameraOrbit.pitch - dy * 0.004, 0.25, 1.3);
      });

      window.addEventListener('pointerup', () => pointerDown = false);
      window.addEventListener('pointerleave', () => pointerDown = false);
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        state.day = 1;
        state.weather = 'Clear';
        state.resources = { food: 40, power: 36, scrap: 28, credits: 18, intel: 5 };
        state.style = { architect: 1, tycoon: 0, renegade: 0, operator: 0 };
        state.heat = 1;
        state.city = 0;
        state.orbit = 0;
        state.totalGathered = 0;
        state.openMarket = false;
        state.unlockedSatellite = false;
        state.mode = 'survival';
        state.logs = [
          { title: 'Again', text: 'A fresh camp begins underneath the cold grey sun.' },
          { title: 'New start', text: 'The shelter still needs to be made livable.' }
        ];
        state.people = [
          { name: 'Mara', role: 'Caretaker', color: '#d7f092', x: -1.5, z: 0.5, needs: { hunger: 72, energy: 70, morale: 68 } },
          { name: 'Ivo', role: 'Scavenger', color: '#8ad0da', x: 1.5, z: -1.5, needs: { hunger: 68, energy: 60, morale: 72 } },
          { name: 'Sera', role: 'Tinkerer', color: '#ffb179', x: 0.5, z: 1.8, needs: { hunger: 80, energy: 74, morale: 76 } }
        ];

        state.structures.forEach(item => item.mesh && item.mesh.removeFromParent());
        state.structures = [];
        state.habitat = 0;
        state.resourceNodes.forEach((node) => {
          node.visible = true;
          node.userData.active = true;
        });

        buildStructure('habitat', -4, 0, true);
        buildStructure('garden', 2.5, -2.5, true);
        player.group.position.set(0, 0.75, 0);
        notify('New settlement begun.');
        renderUI();
      });

      initScene();
      buildPlayerActionBar();
      renderUI();
      animate();
    </script>
  </body>
</html>
